<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دردشة صوتية | VIP</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0820;--sf:#16102f;--sf2:#211748;--wine:#5a1631;--tx:#f7efdc;--mu:#a99fc4;--ok:#5fd6a0;--rd:#e0566b;
--g:linear-gradient(135deg,#fbe9ae 0%,#d9a94a 48%,#9b6d1c 100%);--gl:#e6bc5a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Tajawal,system-ui,sans-serif;color:var(--tx);max-width:560px;margin:auto;display:flex;flex-direction:column;
background:radial-gradient(120% 50% at 50% -10%,#3b1140 0%,transparent 60%),radial-gradient(80% 40% at 100% 100%,#2a1250 0%,transparent 70%),var(--bg)}
button{font-family:inherit;cursor:pointer}
main{flex:1;overflow:auto;padding-top:env(safe-area-inset-top)}
.scr{display:none;min-height:100%}.scr.on{display:block}
.hd{padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:center}
.hd h1{font-family:Amiri,serif;font-size:32px;font-weight:700;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:220% 100%;animation:sh 3.2s ease 1}
@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}
.crest{font-size:12px;color:#2a1a05;background:var(--g);border-radius:99px;padding:3px 11px;font-weight:800}
.subs{display:flex;gap:8px;overflow-x:auto;padding:6px 18px 12px;scrollbar-width:none}
.subs button{flex:none;border:1px solid rgba(230,188,90,.3);background:transparent;color:var(--mu);padding:8px 16px;border-radius:99px;font-size:14px}
.subs button.on{background:var(--g);color:#2a1a05;border-color:transparent;font-weight:800;box-shadow:0 4px 16px rgba(217,169,74,.35)}
.list{padding:4px 18px 120px;display:grid;gap:12px}
.gold,.row,.post,.card,.box{border:1px solid transparent;background:linear-gradient(var(--sf),var(--sf)) padding-box,var(--g) border-box}
.row{display:flex;gap:12px;align-items:center;border-radius:18px;padding:13px;cursor:pointer}
.row.vip{background:linear-gradient(135deg,#2c1240,#1a1036) padding-box,var(--g) border-box;box-shadow:0 6px 24px rgba(155,109,28,.25)}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:16px;font-weight:700}
.row .t span{font-size:13px;color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:Amiri,serif;font-size:24px;font-weight:700;color:#2a1a05;background:var(--g) ;position:relative;box-shadow:0 0 0 3px var(--sf),0 0 0 4.5px var(--gl)}
.av.img{background-size:cover;background-position:center;color:transparent}
.dot{position:absolute;bottom:1px;inset-inline-start:1px;width:13px;height:13px;border-radius:50%;background:var(--ok);border:2px solid var(--sf)}
.bdg{background:var(--g);color:#2a1a05;border-radius:99px;font-size:12px;font-weight:800;padding:2px 9px}
.btn{border:0;background:var(--g);color:#2a1a05;font-weight:800;font-size:15px;border-radius:13px;padding:11px 18px;box-shadow:0 4px 14px rgba(217,169,74,.3)}
.btn:active{transform:scale(.97)}
.btn.g{background:var(--sf2);color:var(--tx);border:1px solid rgba(230,188,90,.35);box-shadow:none}
.btn.r{background:linear-gradient(135deg,#e0566b,#8f1d38);color:#fff;box-shadow:none}
.sm{padding:6px 14px;font-size:13px}
.post{border-radius:18px;padding:14px;display:grid;gap:10px}
.post .top{display:flex;gap:10px;align-items:center}
.imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.imgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.lk{background:none;border:0;color:var(--mu);font-size:14px;justify-self:start}.lk.on{color:var(--rd)}
.fab{position:fixed;inset-inline-end:18px;bottom:calc(100px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--g);font-size:26px;box-shadow:0 8px 24px rgba(0,0,0,.55);display:none}.fab.on{display:block}
.empty{text-align:center;padding:50px 24px;color:var(--mu);display:grid;gap:16px;justify-items:center}
.empty b{font-family:Amiri,serif;font-size:24px;color:var(--tx)}.empty .big{font-size:56px}
nav{display:flex;align-items:flex-end;margin:0 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(var(--sf),var(--sf)) padding-box,var(--g) border-box;border:1px solid transparent;border-radius:26px;padding:6px 4px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:7px 0 5px;font-size:11.5px;display:grid;gap:2px;justify-items:center}
nav button i{font-style:normal;font-size:21px}
nav button.on{color:var(--gl);font-weight:800}
nav button.mid i{width:52px;height:52px;border-radius:50%;background:var(--g);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 18px rgba(217,169,74,.5),0 0 0 4px var(--bg);font-size:24px}
.card{margin:4px 18px 16px;border-radius:24px;padding:22px 16px;text-align:center;display:grid;gap:9px;justify-items:center;background:linear-gradient(160deg,#35154a,#171033) padding-box,var(--g) border-box;box-shadow:0 10px 30px rgba(90,22,49,.4)}
.card .av{width:98px;height:98px;font-size:44px;box-shadow:0 0 0 4px #1a1036,0 0 0 6px var(--gl)}
.pen{position:absolute;bottom:-2px;inset-inline-start:-4px;width:32px;height:32px;border-radius:50%;border:2px solid #1a1036;background:var(--sf2);color:var(--tx);font-size:14px}
.nm{font-family:Amiri,serif;font-size:27px;font-weight:700}
.idl{color:var(--mu);font-size:14px;display:flex;gap:8px;align-items:center}
.cnt{display:grid;grid-template-columns:repeat(3,1fr);width:100%;margin-top:6px;border-top:1px solid rgba(230,188,90,.25);padding-top:12px}
.cnt div{display:grid}.cnt b{font-size:21px;color:var(--gl)}.cnt span{font-size:13px;color:var(--mu)}
.sec{padding:4px 18px 10px;font-family:Amiri,serif;font-size:21px;color:var(--gl)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:0 18px 120px}
.grid button{background:var(--sf);border:1px solid rgba(230,188,90,.25);border-radius:16px;color:var(--tx);font-size:12.5px;padding:13px 2px;display:grid;gap:7px;justify-items:center}
.grid button i{font-style:normal;font-size:25px}
.sh{position:fixed;inset:0;background:rgba(5,3,15,.72);display:none;align-items:flex-end;z-index:30;backdrop-filter:blur(3px)}.sh.on{display:flex}
.box{width:100%;max-width:560px;margin:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));display:grid;gap:12px;max-height:90%;overflow:auto}
.box h3{font-family:Amiri,serif;font-size:24px;color:var(--gl)}
.box p,.mu{color:var(--mu);font-size:14px;line-height:1.7}
input[type=text],input[type=password],input[type=tel],textarea{width:100%;background:var(--bg);border:1px solid rgba(230,188,90,.3);color:var(--tx);border-radius:13px;padding:13px;font:inherit}
input:focus,textarea:focus{outline:2px solid var(--gl)}
.li{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid rgba(230,188,90,.25);border-radius:13px;padding:14px;color:var(--tx);font-size:15px;width:100%}
.bar{height:10px;border-radius:9px;background:var(--bg);overflow:hidden;border:1px solid rgba(230,188,90,.3)}.bar i{display:block;height:100%;background:var(--g)}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pk button{background:var(--bg);border:1px solid rgba(230,188,90,.3);color:var(--tx);border-radius:14px;padding:12px 4px;display:grid;gap:4px}
.ov{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;max-width:560px;margin:auto;padding-top:env(safe-area-inset-top);background:radial-gradient(120% 45% at 50% -5%,#4a1450 0%,transparent 60%),var(--bg)}.ov.on{display:flex}
.oh{display:flex;align-items:center;gap:10px;padding:12px 16px}.oh h2{flex:1;font-family:Amiri,serif;font-size:23px}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid rgba(230,188,90,.4);background:var(--sf);color:var(--tx);font-size:17px}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;padding:10px 14px}
.seat{display:grid;gap:5px;justify-items:center;background:none;border:0;color:var(--tx);font-size:12.5px}
.seat .av{width:60px;height:60px}.seat .av.sp{animation:pl 1.2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 3px var(--sf),0 0 0 9px rgba(230,188,90,.35)}}
.seat .em{width:60px;height:60px;border-radius:50%;border:1.5px dashed rgba(230,188,90,.5);display:grid;place-items:center;color:var(--gl);font-size:22px}
.msgs{flex:1;overflow:auto;padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:78%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.5;background:var(--sf2);align-self:flex-start;word-break:break-word}
.m.me{align-self:flex-end;background:var(--g);color:#2a1a05;font-weight:500}.m small{display:block;color:var(--gl);font-size:11px;font-weight:700}
.send{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid rgba(230,188,90,.25)}
.dock{display:flex;gap:10px;padding:8px 14px;align-items:center}
.bal{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.bal div{background:var(--bg);border:1px solid rgba(230,188,90,.3);border-radius:14px;padding:10px;text-align:center;cursor:pointer}
.bal b{display:block;font-size:22px;color:var(--gl)}.bal span{font-size:13px;color:var(--mu)}
.m.gf{align-self:center;text-align:center;background:linear-gradient(135deg,#5a1631,#35154a);border:1px solid var(--gl);max-width:92%}

.stars{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#f6d98a,transparent),radial-gradient(1px 1px at 70% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 88% 58%,#f6d98a,transparent),radial-gradient(1px 1px at 35% 78%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 48%,#f6d98a,transparent),radial-gradient(1px 1px at 8% 66%,#fff,transparent);animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.2}to{opacity:.85}}
main,nav{position:relative;z-index:1}
.cn{display:inline-block;width:1.05em;height:1.05em;border-radius:50%;vertical-align:-.17em;margin-inline:2px;position:relative;background:radial-gradient(circle at 32% 28%,#fff6c9 0 10%,#f6d365 30%,#d9a22b 62%,#8a5a0c 100%);box-shadow:inset 0 0 0 .1em #c28a1d,inset 0 0 0 .18em #fbe69a,0 0 7px rgba(246,211,101,.65)}
.cn::after{content:"";position:absolute;inset:27%;border-radius:50%;border:.08em solid rgba(122,78,8,.75)}
.dm{display:inline-block;width:1em;height:.9em;vertical-align:-.1em;margin-inline:2px;background:linear-gradient(135deg,#d6f8ff,#59b8ff 45%,#8a5cff);clip-path:polygon(25% 0,75% 0,100% 35%,50% 100%,0 35%)}
.gold-t,.bal b{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn:disabled{opacity:.45;box-shadow:none}
.scr.on{animation:fi .35s ease}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sh.on .box{animation:up .3s ease}@keyframes up{from{transform:translateY(40px);opacity:0}}
.cw{display:inline-block;animation:cwf 2.6s ease-in-out infinite}@keyframes cwf{50%{transform:translateY(-4px) rotate(-8deg)}}
.row,.grid button,.pk button,.gc{transition:transform .15s}.row:active,.grid button:active,.gc:active{transform:scale(.97)}
.row.vip{position:relative;overflow:hidden}
.row.vip::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,230,150,.2) 50%,transparent 65%);transform:translateX(-100%);animation:sw 3.6s ease-in-out infinite;pointer-events:none}
@keyframes sw{60%,100%{transform:translateX(100%)}}
nav button.mid i{animation:gp 2.4s ease-in-out infinite}@keyframes gp{50%{box-shadow:0 6px 30px rgba(247,211,101,.9),0 0 0 4px var(--bg)}}
.pop{animation:pp .5s ease}@keyframes pp{40%{transform:scale(1.3)}}
.cr{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:18px}
.gp{color:var(--gl);font-weight:700;font-size:12px}
.gg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:34vh;overflow:auto;padding:2px}
.gc{background:var(--bg);border:1px solid rgba(230,188,90,.25);border-radius:14px;padding:10px 2px;color:var(--tx);display:grid;gap:4px;justify-items:center;font-size:12px}
.gc .ge{font-size:32px;transition:transform .2s}
.gc.epic{border-color:rgba(255,215,120,.75)}
.gc.sel{border-color:var(--gl);background:linear-gradient(160deg,#3a1a52,#1a1036);box-shadow:0 0 0 1px var(--gl),0 6px 20px rgba(217,169,74,.3)}
.gc.sel .ge{transform:scale(1.22) translateY(-2px)}
.gb{display:flex;gap:8px;align-items:center}.gb .btn{flex:1}
.qs{display:flex;gap:6px}.qs button{background:var(--bg);border:1px solid rgba(230,188,90,.3);color:var(--mu);border-radius:10px;padding:8px 9px;font-size:13px}.qs .on{background:var(--g);color:#2a1a05;font-weight:800}
.fly{position:fixed;left:50%;top:38%;font-size:96px;z-index:70;pointer-events:none;animation:fl 2s ease forwards;filter:drop-shadow(0 8px 22px rgba(230,188,90,.6))}
.fly.t2{font-size:120px}.fly.t3{font-size:150px;animation:fl3 3.2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fl{0%{transform:translate(-50%,40px) scale(.3);opacity:0}25%{transform:translate(-50%,0) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-90px) scale(1);opacity:0}}
@keyframes fl3{0%{transform:translate(-50%,60px) scale(.2) rotate(-12deg);opacity:0}18%{transform:translate(-50%,0) scale(1.25) rotate(4deg);opacity:1}30%{transform:translate(-50%,0) scale(1)}85%{opacity:1;transform:translate(-50%,-10px) scale(1.05)}100%{opacity:0;transform:translate(-50%,-70px) scale(1.1)}}
.pt{position:fixed;left:50%;top:44%;font-style:normal;font-size:var(--s,20px);z-index:69;pointer-events:none;animation:bs 1.6s ease-out forwards}
@keyframes bs{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);opacity:0}}
.pt.rain{left:var(--x);top:-30px;animation:rn 2.6s linear var(--d) forwards}
@keyframes rn{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(360deg);opacity:.9}}
.glow{position:fixed;inset:0;z-index:68;pointer-events:none;background:radial-gradient(circle at 50% 42%,rgba(255,225,130,.55),rgba(155,109,28,.25) 40%,transparent 70%);animation:gl 3s ease forwards}
@keyframes gl{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.bn{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:72;background:var(--g);color:#2a1a05;font-weight:800;border-radius:99px;padding:9px 20px;box-shadow:0 8px 26px rgba(0,0,0,.5);animation:bn 2.6s ease forwards;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
@keyframes bn{0%{transform:translate(-50%,-30px);opacity:0}12%{transform:translate(-50%,0);opacity:1}85%{opacity:1}100%{transform:translate(-50%,-10px);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--g);color:#2a1a05;font-weight:800;border-radius:99px;padding:9px 20px;z-index:99;display:none;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.lock{z-index:50;justify-content:center;align-items:center;text-align:center;gap:16px;padding:24px}
.lock h1{font-family:Amiri,serif;font-size:56px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.lock>*{width:100%;max-width:340px}

.vf{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#2d8cff;color:#fff;font-size:10px;margin-inline:4px;vertical-align:1px}
.vipn{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.ttl{font-size:11px;color:#2a1a05;background:var(--g);border-radius:99px;padding:1px 8px;margin-inline-start:6px;font-weight:800}
.ov .list{overflow:auto;flex:1}
.chip{font-size:11px;border-radius:99px;padding:1px 8px;background:var(--wine);color:#fff;margin-inline-start:4px}
.lock .subs{justify-content:center;padding:0}
.lock input[hidden]{display:none}
</style>
</head>
<body>
<div class="stars"></div>
<main>
 <section id="home" class="scr on"><div class="hd"><h1><span class="cw">👑</span> دردشة صوتية</h1><span class="crest">VIP</span></div><div class="subs" data-k="home"></div><div class="list" id="list-home"></div></section>
 <section id="mom" class="scr"><div class="hd"><h1>اللحظات</h1></div><div class="subs" data-k="mom"></div><div class="list" id="list-mom"></div></section>
 <section id="room" class="scr"><div class="hd"><h1>الغرفة</h1><button class="btn sm" id="newroom" onclick="newRoom()">＋ إنشاء غرفة</button></div><div class="list" id="list-room"></div></section>
 <section id="msg" class="scr"><div class="hd"><h1>الرسائل</h1></div><div class="subs" data-k="msg"></div><div class="list" id="list-msg"></div></section>
 <section id="me" class="scr">
  <div class="hd"><h1>أنا</h1><button class="ib" onclick="openSettings()" aria-label="الإعدادات">⚙️</button></div>
  <div class="card">
   <div class="av" id="myav"><span id="mych">م</span><button class="pen" onclick="$('#avin').click()" aria-label="تغيير الصورة">✏️</button></div>
   <div class="nm" id="myname"></div>
   <div class="idl">ID: <b id="myid" style="color:var(--tx)"></b><button class="btn g sm" onclick="copyId()">نسخ</button></div>
   <span class="crest" id="mylv"></span>
   <div class="bal" onclick="tool(0)"><div><b id="mycoin">0</b><span><i class="cn"></i> كوينز</span></div><div><b id="mydia">0</b><span><i class="dm"></i> ألماس</span></div></div>
   <div class="cnt"><div><b id="c1">0</b><span>أتابعهم</span></div><div><b id="c2">0</b><span>الأصدقاء</span></div><div><b id="c3">0</b><span>المتابعون</span></div></div>
   <button class="btn g" onclick="editName()">تعديل الاسم</button>
   <button class="btn" id="adbtn" style="display:none" onclick="openAdmin()">🛡️ لوحة الإدارة</button>
  </div>
  <div class="sec">الأدوات العامة</div><div class="grid" id="tools"></div>
 </section>
</main>
<button class="fab" id="fab" onclick="openCam()" aria-label="لحظة جديدة">📷</button>
<nav id="nav"></nav>
<input type="file" id="avin" accept="image/*" hidden>

<div class="ov" id="rm">
 <div class="oh"><button class="ib" onclick="leaveRoom()" aria-label="خروج">✕</button><h2 id="rmt"></h2><span class="crest" id="rmc"></span></div>
 <div class="seats" id="seats"></div>
 <div class="msgs" id="rmsgs"></div>
 <div class="dock"><button class="btn" id="mic" style="flex:1" onclick="toggleMic()">🎙️ تشغيل الميكروفون</button><button class="btn g" onclick="giftUI(false)">🎁 هدية</button></div>
 <div class="send"><input type="text" id="rin" placeholder="اكتب رسالة للغرفة" onkeydown="if(event.key==='Enter')rSend()"><button class="btn" onclick="rSend()">إرسال</button></div>
</div>
<div class="ov" id="ch">
 <div class="oh"><button class="ib" onclick="closeChat()" aria-label="رجوع">›</button><h2 id="cht"></h2><button class="ib" id="favb" onclick="toggleFav()" aria-label="مفضل">☆</button></div>
 <div class="msgs" id="cmsgs"></div>
 <div class="send"><button class="btn g" onclick="giftUI(true)" aria-label="هدية">🎁</button><input type="text" id="cin" placeholder="اكتب رسالة" onkeydown="if(event.key==='Enter')cSend()"><button class="btn" onclick="cSend()">إرسال</button></div>
</div>
<div class="ov lock on" id="lock">
 <h1>👑 دردشة صوتية</h1><p class="mu" id="lkmsg">أهلاً بك في عالم النخبة</p>
 <div class="subs"><button id="tl" class="on" onclick="authMode('login')">تسجيل الدخول</button><button id="ts" onclick="authMode('signup')">حساب جديد</button></div>
 <input type="text" id="an" placeholder="الاسم" maxlength="24" hidden>

const authErr=c=>({'auth/invalid-email':'البريد غير صالح','auth/email-already-in-use':'هذا البريد مسجل من قبل','auth/weak-password':'كلمة المرور ضعيفة','auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة','auth/user-not-found':'الحساب غير موجود','auth/wrong-password':'كلمة المرور غير صحيحة','auth/too-many-requests':'محاولات كثيرة، انتظر قليلاً','auth/requires-recent-login':'سجّل الدخول من جديد ثم أعد المحاولة','auth/network-request-failed':'تحقق من الاتصال بالإنترنت','auth/operation-not-allowed':'فعّل Email/Password من Firebase Authentication','permission-denied':'لا توجد صلاحية، راجع قواعد Firestore'}[c]||'تعذر تنفيذ العملية');
function shrink(file,max,q){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}

async function makeProfile(u,x){
 const ref=db.collection('users').doc(u.uid),cr=db.collection('meta').doc('counter');
 await db.runTransaction(async t=>{
  const d=await t.get(ref);if(d.exists)return;
  const c=await t.get(cr),n=c.exists?c.data().n+1:100001;
  t.set(cr,{n});
  t.set(ref,{uid:u.uid,name:x.name,id:String(n),email:x.email||'',phone:x.phone||'',av:'',coins:0,diamonds:0,xp:0,done:[],log:[],ver:{phone:0,email:0,id:0},family:'',following:[],favs:[],createdAt:FV.serverTimestamp(),lastSeen:Date.now()});
 });
}

 if(!u){USERS=[];ROOMSL=[];POSTS=[];CHATS=[];FOLLOWERS=[];TOPS=[];CFG={};me=BLANK();$('#ap').value='';$('#lock').classList.add('on');return}
 unsubs.push(db.collection('users').doc(u.uid).onSnapshot(async d=>{
  if(!d.exists){
   if(!making&&!deleting){making=true;try{const em=u.email||'',ph=em.endsWith('@phone.sada.app');await makeProfile(u,PENDING||{name:'مستخدم',phone:ph?'+'+em.split('@')[0]:'',email:ph?'':em})}catch(e){toast(authErr(e.code))}making=false}
   return}

   if(RM)leaveRoom();closeChat();unsubs.slice(1).forEach(f=>f());unsubs=unsubs.slice(0,1);clearInterval(hb);streams=false;

  $('#ban').classList.remove('on');

 unsubs.push(Q('posts').orderBy('createdAt','desc').limit(40).onSnapshot(s=>{POSTS=s.docs.map(d=>({...d.data(),pid:d.id}));draw('mom')},bad));
 unsubs.push(Q('chats').where('members','array-contains',U.uid).onSnapshot(s=>{

 },bad));
 unsubs.push(Q('users').where('following','array-contains',U.uid).onSnapshot(s=>{FOLLOWERS=s.docs.map(d=>d.id);drawMe()},bad));
 unsubs.push(Q('topups').where('uid','==',U.uid).onSnapshot(s=>{TOPS=s.docs.map(d=>({...d.data(),tid:d.id}))},()=>{}));

 upd({lastSeen:Date.now()}).catch(()=>{});hb=setInterval(()=>upd({lastSeen:Date.now()}).catch(()=>{}),60000);

const R={
 home(){const k=cur.home;
  if(k==='new')return USERS.length?USERS.map(userRow).join(''):empty('👥','لا يوجد مستخدمون آخرون بعد','سيظهر هنا كل من يسجّل حساباً جديداً.');

 mom(){const l=POSTS.filter(p=>cur.mom==='rec'||p.uid===U.uid||me.following.includes(p.uid));
  return l.length?l.map(p=>{const u=userOf(p.uid,p.name),ld=(p.likes||[]).includes(U.uid);
   return `<div class="post"><div class="top">${avU(u)}<b>${nm(u)}</b></div>${p.x?`<div>${esc(p.x)}</div>`:''}${(p.imgs||[]).length?`<div class="imgs">${p.imgs.map(i=>`<img src="${i}" alt="">`).join('')}</div>`:''}<button class="lk ${ld?'on':''}" onclick="like('${p.pid}')">${ld?'♥':'♡'} ${(p.likes||[]).length}</button></div>`}).join(''):empty('📷','لا توجد لحظات بعد','اضغط الكاميرا وانشر أول لحظة.')},
 msg(){const k=cur.msg;
  let l=CHATS.map(c=>{const oid=c.members.find(m=>m!==U.uid);return{c,o:USERS.find(u=>u.uid===oid)||{uid:oid,name:(c.names||{})[oid]||'مستخدم',av:''}}})
   .filter(({c,o})=>k==='all'||(k==='online'&&isOn(o))||(k==='top'&&(c.count||0)>0)||(k==='unread'&&(c.unread||{})[U.uid]>0)||(k==='fav'&&me.favs.includes(o.uid))||(k==='fol'&&me.following.includes(o.uid)));
  l.sort((a,b)=>k==='top'?(b.c.count||0)-(a.c.count||0):(b.c.lastAt||0)-(a.c.lastAt||0));
  return l.length?l.map(({c,o})=>{const un=(c.unread||{})[U.uid]||0;return `<div class="row" onclick="openChat('${c.cid}')">${avU(o,isOn(o))}<div class="t"><b>${nm(o)}</b><span>${esc(c.last||'')}</span></div><div style="display:grid;gap:6px;justify-items:end"><span style="font-size:12px;color:var(--mu)">${fmtT(c.lastAt)}</span>${un?`<span class="bdg">${un}</span>`:''}</div></div>`}).join(''):empty('💬','لا توجد محادثات هنا','ابدأ من قائمة المستخدمين الجدد في الرئيسية.')}
};

/* ===== الصوت الحقيقي: WebRTC عبر Firestore (شبكة مباشرة بين المتحدثين والمستمعين) ===== */
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
let LP={},SP={},rtcUn=null,AUD=null;
const gather=pc=>new Promise(r=>{if(pc.iceGatheringState==='complete')return r();pc.onicegatheringstatechange=()=>pc.iceGatheringState==='complete'&&r();setTimeout(r,2500)});
document.addEventListener('click',()=>AUD&&AUD.querySelectorAll('audio').forEach(a=>a.play().catch(()=>{})));
function rtcInit(){
 if(!AUD){AUD=document.createElement('div');AUD.style.display='none';document.body.appendChild(AUD)}
 rtcUn=roomRef().collection('rtc').where('spk','==',U.uid).onSnapshot(s=>s.docChanges().forEach(c=>{
  const id=c.doc.id,d=c.doc.data();
  if(c.type==='removed'){if(SP[id]){SP[id].pc.close();delete SP[id]}return}
  if(!SP[id]&&d.offer&&Date.now()-d.at<120000)spkAnswer(id,d);
 }));
}
async function spkAnswer(id,d){
 const ref=roomRef().collection('rtc').doc(id),pc=new RTCPeerConnection(ICE),o=SP[id]={pc};
 try{
  await pc.setRemoteDescription({type:'offer',sdp:d.offer});
  const tr=pc.getTransceivers()[0];tr.direction='sendonly';o.snd=tr.sender;
  if(stream)await tr.sender.replaceTrack(stream.getAudioTracks()[0]);
  await pc.setLocalDescription(await pc.createAnswer());await gather(pc);
  await ref.update({answer:pc.localDescription.sdp});
 }catch(e){pc.close();delete SP[id]}
}
function rtcSync(){
 if(!RM)return;
 const want=new Set(SEATS.filter(s=>s&&s.uid!==U.uid).map(s=>s.uid));
 want.forEach(u=>{if(!LP[u])lisConnect(u)});
 Object.keys(LP).forEach(u=>{if(!want.has(u))lisClose(u)});
}
async function lisConnect(spk){
 const ref=roomRef().collection('rtc').doc(spk+'_'+U.uid+'_'+Date.now()),pc=new RTCPeerConnection(ICE),o=LP[spk]={pc,ref};
 pc.addTransceiver('audio',{direction:'recvonly'});
 pc.ontrack=e=>{const a=document.createElement('audio');a.autoplay=true;a.playsInline=true;a.srcObject=e.streams[0]||new MediaStream([e.track]);AUD.appendChild(a);o.a=a;a.play().catch(()=>{})};
 pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'&&LP[spk]===o)lisClose(spk)};
 try{
  await pc.setLocalDescription(await pc.createOffer());await gather(pc);
  if(LP[spk]!==o)return;
  await ref.set({spk,lis:U.uid,offer:pc.localDescription.sdp,at:Date.now()});
  o.un=ref.onSnapshot(async s=>{const d=s.data();
   if(d&&d.answer&&!o.ok&&LP[spk]===o){o.ok=true;try{await pc.setRemoteDescription({type:'answer',sdp:d.answer})}catch(e){}}});
 }catch(e){if(LP[spk]===o)lisClose(spk)}
}
function lisClose(u){const o=LP[u];if(!o)return;delete LP[u];o.un&&o.un();o.pc.close();o.a&&o.a.remove();o.ref.delete().catch(()=>{})}

function setQ(q){GQ=q;document.querySelectorAll('.qs button').forEach(b=>b.classList.toggle('on',b.textContent==='×'+q));upSend()}
function upSend(){const b=$('#gsend');if(GSEL<0){b.disabled=true;b.textContent='اختر هدية';return}const g=GIFTS[GSEL];b.disabled=false;b.innerHTML='إرسال '+g[1]+' ×'+GQ+' · <i class="cn"></i> '+g[3]*GQ}

async function sendGift(){
 if(GSEL<0)return;
 if(me.muted)return toast('أنت مكتوم من الإدارة');
 const g=GIFTS[GSEL],tot=g[3]*GQ,to=GOPTS[GTI];
 if((me.coins||0)<tot){toast('رصيدك غير كافٍ، اشحن الكوينز');return rechargeUI(()=>giftUI(GCTX==='chat'))}
 const q=GQ>1?' ×'+GQ:'',t=me.name+' أهدى '+to.name+' '+g[1]+' '+g[2]+q;
 try{
  await db.runTransaction(async tx=>{
   const sr=db.collection('users').doc(U.uid),rr=db.collection('users').doc(to.uid),s=await tx.get(sr);
   if((s.data().coins||0)<tot)throw new Error('low');
   tx.update(sr,{coins:FV.increment(-tot),...logu('هدية '+g[2]+q+' إلى '+to.name+': −'+tot+' كوين')});
   tx.update(rr,{diamonds:FV.increment(tot)});
  });
 }catch(e){return toast(e.message==='low'?'رصيدك غير كافٍ':authErr(e.code))}
 const gm={e:g[1],tot};
 if(GCTX==='room'){
  const si=SEATS.findIndex(x=>x&&x.uid===to.uid);
  if(si>-1)roomRef().collection('seats').doc(String(si)).update({g:FV.increment(tot)}).catch(()=>{});
  roomRef().collection('msgs').add({from:U.uid,name:me.name,x:t,gift:gm,at:Date.now()});
 }else chatPost(t,{gift:gm}).catch(()=>{});
 closeSheet();fx(g[1],tot,t);
}
function fx(e,tot,t){
 const tier=tot>=1000?3:tot>=100?2:1,b=document.body;
 const big=document.createElement('div');big.className='fly t'+tier;big.textContent=e;b.appendChild(big);setTimeout(()=>big.remove(),tier===3?3300:2100);
 if(NOMOTION)return;
 const n=tier===3?44:tier===2?18:0;
 for(let i=0;i<n;i++){
  const p=document.createElement('i');p.className='pt'+(tier===3?' rain':'');p.textContent=i%3?'✨':e;
  const a=Math.random()*6.28,r=90+Math.random()*130;
  p.style.cssText='--dx:'+Math.cos(a)*r+'px;--dy:'+Math.sin(a)*r+'px;--x:'+Math.random()*100+'vw;--d:'+Math.random()*.9+'s;--s:'+(14+Math.random()*18)+'px';
  b.appendChild(p);setTimeout(()=>p.remove(),3500);
 }
 if(tier===3){const g=document.createElement('div');g.className='glow';b.appendChild(g);setTimeout(()=>g.remove(),3100)}
 if(tier>=2){const x=document.createElement('div');x.className='bn';x.textContent='🎁 '+t;b.appendChild(x);setTimeout(()=>x.remove(),2700)}
}

/* ===== الإعدادات ===== */
function openSettings(){sheet(`<h3>الإعدادات</h3>
 <button class="li" onclick="security()"><span>🔒 الحساب والأمان</span><span>‹</span></button>
 <button class="li" onclick="switchAcc()"><span>🔁 تبديل الحساب</span><span>‹</span></button>
 <button class="btn r" onclick="logout()">خروج</button>`)}
function security(){sheet(`<h3>الحساب والأمان</h3>
 <button class="li" onclick="passUI()"><span>🔑 تعديل كلمة مرور الحساب</span><span>‹</span></button>
 <button class="li" onclick="phoneUI()"><span>📱 ربط رقم الهاتف ${me.phone?'· '+esc(me.phone):''}</span><span>‹</span></button>

function passUI(){sheet(`<h3>تعديل كلمة المرور</h3><input type="password" id="p0" placeholder="كلمة المرور الحالية"><input type="password" id="p1" placeholder="الجديدة (6 أحرف على الأقل)"><input type="password" id="p2" placeholder="تأكيد الجديدة"><button class="btn" onclick="passSave()">حفظ</button><button class="btn g" onclick="security()">رجوع</button>`)}

 if(!$('#p0').value)return toast('أدخل كلمة المرور الحالية');

 try{await U.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(U.email,$('#p0').value));await U.updatePassword(p1);closeSheet();toast('تم تعديل كلمة المرور')}catch(e){toast(authErr(e.code))}
}
function phoneUI(){sheet(`<h3>ربط رقم الهاتف</h3><input type="tel" id="ph" inputmode="tel" dir="ltr" placeholder="9647701234567" value="${esc(me.phone||'')}"><button class="btn" onclick="phoneSave()">ربط الرقم</button><button class="btn g" onclick="security()">رجوع</button>`)}
async function phoneSave(){const v=$('#ph').value.replace(/\D/g,'');if(v.length<8||v.length>15)return toast('رقم غير صالح');try{await upd({phone:'+'+v});toast('تم ربط الرقم');security()}catch(e){toast(authErr(e.code))}}
function delUI(){sheet(`<h3>حذف الحساب</h3><p>سيُحذف حسابك وغرفتك نهائياً. للتأكيد اكتب كلمة <b>حذف</b> وكلمة مرورك.</p><input type="text" id="dc" placeholder="حذف"><input type="password" id="dp" placeholder="كلمة المرور"><button class="btn r" onclick="delGo()">احذف حسابي</button><button class="btn g" onclick="security()">إلغاء</button>`)}
async function delGo(){
 if($('#dc').value.trim()!=='حذف')return toast('اكتب كلمة حذف للتأكيد');
 deleting=true;
 try{
  await U.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(U.email,$('#dp').value));
  if(RM)await leaveRoom();

 }catch(e){toast(authErr(e.code))}

function switchAcc(){sheet(`<h3>تبديل الحساب</h3><div class="li"><span>${esc(me.name)} · ${esc(me.id)}</span><span class="bdg">الحالي</span></div><button class="btn" onclick="logout()">الدخول بحساب آخر</button><button class="btn g" onclick="openSettings()">رجوع</button>`)}
async function logout(){closeSheet();if(RM)await leaveRoom();closeChat();auth.signOut()}


/* ===== الإعلانات ولوحة الإدارة ===== */
function announce(){
 const a=CFG.announce;if(!a)return;let seen='';
 try{seen=localStorage.getItem('sada_ann')}catch(e){}
 if(String(CFG.at)===seen)return;
 try{localStorage.setItem('sada_ann',String(CFG.at))}catch(e){}
 sheet(`<h3>📢 إعلان من الإدارة</h3><p style="color:var(--tx);font-size:16px">${esc(a)}</p>${back}`);
}
let AU=[],ATOP=[],ASUP=[],ALOG=[],adUn=[],adTab='users',adQ='';
const ADTABS=[['users','المستخدمون'],['ver','التوثيق'],['top','الشحن'],['rooms','الغرف'],['help','الدعم'],['log','السجل'],['ann','الإعدادات']];
/* ===== الأدوار: admin = كل شيء، mod = صلاحيات يحددها المدير ===== */
const isStaff=()=>me.role==='admin'||me.role==='mod';
const can=k=>me.role==='admin'||(me.role==='mod'&&!!(me.perms&&me.perms[k]));
const PERM_L=[['ver','التوثيق'],['top','الشحن'],['mute','الكتم'],['ban','الحظر'],['rooms','حذف الغرف'],['help','الدعم']];
const TABPERM={users:()=>can('ver')||can('mute')||can('ban'),ver:()=>can('ver'),top:()=>can('top'),rooms:()=>can('rooms'),help:()=>can('help'),log:()=>me.role==='admin',ann:()=>me.role==='admin'};
const logA=(a,to)=>db.collection('modlog').add({by:U.uid,byName:me.name||'',a,to:to||'',at:Date.now()}).catch(()=>{});
function openAdmin(){
 if(!isStaff())return;
 adTab='users';adQ='';$('#adq').value='';$('#ad').classList.add('on');
 const bad=e=>toast(authErr(e.code)),live=()=>{if(adTab!=='ann')drawAd()};
 if(TABPERM.users())adUn.push(db.collection('users').orderBy('createdAt','desc').limit(300).onSnapshot(s=>{AU=s.docs.map(d=>d.data());live()},bad));
 if(can('top'))adUn.push(db.collection('topups').where('status','==','pending').onSnapshot(s=>{ATOP=s.docs.map(d=>({...d.data(),tid:d.id})).sort((a,b)=>a.at-b.at);live()},bad));
 if(can('help'))adUn.push(db.collection('support').orderBy('at','desc').limit(50).onSnapshot(s=>{ASUP=s.docs.map(d=>({...d.data(),sid:d.id}));live()},bad));
 if(me.role==='admin')adUn.push(db.collection('modlog').orderBy('at','desc').limit(60).onSnapshot(s=>{ALOG=s.docs.map(d=>d.data());live()},bad));
 drawAd();
}
function closeAdmin(){adUn.forEach(f=>f());adUn=[];$('#ad').classList.remove('on')}
const VER_L={phone:'الهاتف',email:'البريد',id:'الهوية'};
function drawAd(){
 const TB=ADTABS.filter(([k])=>TABPERM[k]());if(TB.length&&!TB.some(x=>x[0]===adTab))adTab=TB[0][0];
 $('#adsubs').innerHTML=TB.map(([k,l])=>`<button class="${k===adTab?'on':''}" onclick="adTab='${k}';drawAd()">${l}${k==='top'&&ATOP.length?' ('+ATOP.length+')':''}</button>`).join('');
 $('#adq').style.display=adTab==='users'||adTab==='ver'?'':'none';
 const q=adQ.trim().toLowerCase(),L=$('#adl'),hit=u=>!q||[u.name,u.id,u.phone,u.email].some(x=>String(x||'').toLowerCase().includes(q));
 if(adTab==='users'){
  const l=AU.filter(hit).slice(0,80);
  L.innerHTML=`<div class="mu">إجمالي المستخدمين: ${AU.length}</div>`+(l.length?l.map(u=>`<div class="row" onclick="manage('${u.uid}')">${avU(u,isOn(u))}<div class="t"><b>${nm(u)}${u.banned?'<span class="chip">محظور</span>':''}${u.muted?'<span class="chip">مكتوم</span>':''}${u.role==='admin'?'<span class="chip">مدير</span>':''}${u.role==='mod'?'<span class="chip">مشرف</span>':''}</b><span>ID ${esc(u.id)} · ${u.coins||0} كوين · ${u.diamonds||0} ألماس</span></div></div>`).join(''):empty('🔎','لا نتائج'));
 }
 if(adTab==='ver'){
  const l=AU.filter(u=>Object.values(u.ver||{}).includes(1)).filter(hit);
  L.innerHTML=l.length?l.map(u=>`<div class="row">${avU(u)}<div class="t"><b>${nm(u)}</b><span>ID ${esc(u.id)} · ${Object.keys(u.ver).filter(k=>u.ver[k]===1).map(k=>VER_L[k]||k).join('، ')}</span></div><button class="btn sm" onclick="adVer('${u.uid}',true)">قبول</button><button class="btn g sm" onclick="adVer('${u.uid}',false)">رفض</button></div>`).join(''):empty('✅','لا طلبات توثيق');
 }
 if(adTab==='top')L.innerHTML=ATOP.length?ATOP.map(t=>`<div class="post"><div class="top"><b>${esc(t.name)}</b><span class="mu">ID ${esc(t.id)}</span></div><div><i class="cn"></i> ${t.coins} · ${esc(t.price)}</div><div class="mu">العملية: ${esc(t.note)}</div><div style="display:flex;gap:8px"><button class="btn sm" onclick="adTop('${t.tid}',true)">موافقة وإضافة</button><button class="btn r sm" onclick="adTop('${t.tid}',false)">رفض</button></div></div>`).join(''):empty('🪙','لا طلبات شحن معلقة');
 if(adTab==='rooms')L.innerHTML=ROOMSL.length?ROOMSL.map(r=>`<div class="row"><div class="av">${esc((r.name||'?')[0])}</div><div class="t"><b>${esc(r.name)}${r.vip?'<span class="chip">VIP</span>':''}</b><span>${esc(r.hostName)} · 🎧 ${Math.max(0,r.count||0)}</span></div>${me.role==='admin'?`<button class="btn g sm" onclick="adRoom('${r.rid}',0)">${r.vip?'إلغاء VIP':'VIP'}</button>`:''}<button class="btn r sm" onclick="adRoom('${r.rid}',1)">حذف</button></div>`).join(''):empty('🎙️','لا توجد غرف');
 if(adTab==='help')L.innerHTML=ASUP.length?ASUP.map(m=>`<div class="post"><div class="top"><b>${esc(m.name)}</b><span class="mu">${fmtT(m.at)}</span></div><div>${esc(m.x)}</div><button class="btn g sm" style="justify-self:start" onclick="adHelp('${m.sid}')">تمت المعالجة</button></div>`).join(''):empty('🎧','لا رسائل دعم');
 if(adTab==='log')L.innerHTML=ALOG.length?ALOG.map(x=>`<div class="row"><div class="t"><b>${esc(x.byName||'')}</b><span>${esc(x.a)} · ${fmtT(x.at)}</span></div></div>`).join(''):empty('📜','لا يوجد سجل');
 if(adTab==='ann')L.innerHTML=`<div class="post"><b>إعلان لكل المستخدمين</b><textarea id="an1" rows="3" placeholder="نص الإعلان">${esc(CFG.announce||'')}</textarea><button class="btn" onclick="adCfg('announce')">نشر الإعلان</button></div>
  <div class="post"><b>تعليمات الشحن (تظهر عند طلب الشحن)</b><textarea id="pn1" rows="3" placeholder="مثال: حوّل إلى الحساب ... ثم اكتب رقم العملية">${esc(CFG.payNote||'')}</textarea><button class="btn" onclick="adCfg('payNote')">حفظ التعليمات</button></div>`;
}
function manage(uid){
 const u=AU.find(x=>x.uid===uid);if(!u)return;
 const adm=me.role==='admin';
 if(!adm&&(u.role==='admin'||u.role==='mod'))return toast('لا يمكنك إدارة المشرفين والمدراء');
 const P=u.perms||{};
 sheet(`<h3>${nm(u)}</h3>
 <p>ID: ${esc(u.id)}<br>${esc(u.email||'')} ${esc(u.phone||'')}<br>المستوى ${1+Math.floor((u.xp||0)/100)} · ${u.coins||0} كوين · ${u.diamonds||0} ألماس</p>
 <div class="pk">${can('ver')?`<button onclick="adSet('${uid}',{verified:${!u.verified}})">${u.verified?'إلغاء التوثيق':'✔ توثيق'}</button>`:''}${adm?`<button onclick="adSet('${uid}',{vip:${!u.vip}})">${u.vip?'إلغاء VIP':'👑 VIP'}</button>`:''}${can('mute')?`<button onclick="adSet('${uid}',{muted:${!u.muted}})">${u.muted?'فك الكتم':'🔇 كتم'}</button>`:''}</div>
 ${adm?`<input type="text" id="mt" maxlength="20" placeholder="لقب خاص" value="${esc(u.title||'')}"><button class="btn g" onclick="adSet('${uid}',{title:$('#mt').value.trim()})">حفظ اللقب</button>
 <input type="tel" id="mn" inputmode="numeric" placeholder="الكمية (سالب للخصم)">
 <div class="pk"><button onclick="adAdd('${uid}','coins')">كوينز</button><button onclick="adAdd('${uid}','diamonds')">ألماس</button><button onclick="adAdd('${uid}','xp')">خبرة</button></div>`:''}
 ${can('ban')?(u.banned?`<button class="btn" onclick="adSet('${uid}',{banned:false,banReason:''})">رفع الحظر</button>`:`<input type="text" id="br" placeholder="سبب الحظر"><button class="btn r" onclick="adBan('${uid}')">⛔ حظر الحساب</button>`):''}
 ${adm?`<div class="mu" style="margin-top:8px">الدور: ${u.role==='admin'?'مدير':u.role==='mod'?'مشرف':'عضو'}</div><div class="pk"><button onclick="adRole('${uid}','mod')">مشرف</button><button onclick="adRole('${uid}','admin')">مدير</button><button onclick="adRole('${uid}','')">عضو عادي</button></div>`:''}
 ${adm&&u.role==='mod'?`<div class="mu">صلاحيات المشرف:</div><div class="pk">${PERM_L.map(([k,l])=>`<button onclick="adSet('${uid}',{'perms.${k}':${!P[k]}})">${P[k]?'✅':'⬜'} ${l}</button>`).join('')}</div>`:''}${back}`);
}
const KP={verified:'ver',muted:'mute',banned:'ban',banReason:'ban'};
async function adSet(uid,o){
 if(!Object.keys(o).every(k=>can(KP[k]||'__admin')))return toast('ليست لديك صلاحية');
 try{await db.collection('users').doc(uid).update(o);logA(JSON.stringify(o).slice(0,120),uid);toast('تم');manage(uid)}catch(e){toast(authErr(e.code))}
}
async function adAdd(uid,f){
 if(me.role!=='admin')return toast('ليست لديك صلاحية');
 const u=AU.find(x=>x.uid===uid),n=parseInt($('#mn').value,10);
 if(!n)return toast('أدخل الكمية');
 if((u[f]||0)+n<0)return toast('الرصيد لا يكفي للخصم');
 try{await db.collection('users').doc(uid).update({[f]:FV.increment(n)});logA(f+' '+n,uid);toast('تم');manage(uid)}catch(e){toast(authErr(e.code))}
}
function adBan(uid){
 if(uid===U.uid)return toast('لا يمكنك حظر نفسك');
 adSet(uid,{banned:true,banReason:$('#br').value.trim()||'مخالفة شروط الاستخدام'});
}
function adRole(uid,r){
 if(me.role!=='admin')return toast('ليست لديك صلاحية');
 if(uid===U.uid)return toast('لا يمكنك تغيير صلاحيتك');
 const o=r==='mod'?{role:'mod',perms:{ver:true,mute:true,help:true}}:r==='admin'?{role:'admin',perms:FV.delete()}:{role:FV.delete(),perms:FV.delete()};
 db.collection('users').doc(uid).update(o).then(()=>{logA('role '+(r||'user'),uid);toast('تم');manage(uid)}).catch(e=>toast(authErr(e.code)));
}
async function adVer(uid,ok){
 if(!can('ver'))return toast('ليست لديك صلاحية');
 const u=AU.find(x=>x.uid===uid),v={};Object.keys(u.ver||{}).forEach(k=>v[k]=u.ver[k]===1?(ok?2:0):u.ver[k]);
 try{await db.collection('users').doc(uid).update(ok?{verified:true,ver:v}:{ver:v});logA(ok?'verify ok':'verify no',uid);toast(ok?'تم التوثيق':'تم الرفض')}catch(e){toast(authErr(e.code))}
}
async function adTop(tid,ok){
 if(!can('top'))return toast('ليست لديك صلاحية');
 const t=ATOP.find(x=>x.tid===tid);
 try{
  await db.runTransaction(async tx=>{
   const tr=db.collection('topups').doc(tid),d=await tx.get(tr);
   if(d.data().status!=='pending')throw new Error('done');
   if(ok)tx.update(db.collection('users').doc(t.uid),{coins:FV.increment(t.coins)});
   tx.update(tr,{status:ok?'done':'rejected',by:U.uid,doneAt:Date.now()});
  });
  logA('topup '+(ok?'ok ':'no ')+t.coins,t.uid);toast(ok?'تمت الموافقة وأُضيف الرصيد':'تم الرفض');
 }catch(e){toast(e.message==='done'?'تمت معالجته مسبقاً':authErr(e.code))}
}
async function adRoom(rid,del){
 const r=ROOMSL.find(x=>x.rid===rid);if(!r)return;
 if(del?!can('rooms'):me.role!=='admin')return toast('ليست لديك صلاحية');
 logA((del?'delete room ':'vip room ')+r.name,'');
 if(del&&!confirm('حذف الغرفة نهائياً؟'))return;
 try{del?await db.collection('rooms').doc(rid).delete():await db.collection('rooms').doc(rid).update({vip:!r.vip});toast('تم')}catch(e){toast(authErr(e.code))}
}
const adHelp=sid=>!can('help')?toast('ليست لديك صلاحية'):db.collection('support').doc(sid).delete().catch(e=>toast(authErr(e.code)));
async function adCfg(k){if(me.role!=='admin')return toast('ليست لديك صلاحية');const v=$(k==='announce'?'#an1':'#pn1').value.trim();try{await db.collection('config').doc('app').set(k==='announce'?{announce:v,at:Date.now()}:{payNote:v},{merge:true});toast('تم الحفظ')}catch(e){toast(authErr(e.code))}}

authMode('login');
if(hasFB)auth.onAuthStateChanged(onAuth);
else{$('#lkmsg').textContent='⚠️ أضف إعدادات Firebase في أعلى الكود (FBCFG) ثم أعد فتح الصفحة';}
</script>
