<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إيزيدي دردشة</title>
<style>
:root{--red:#e8120c;--yel:#f2ee2e;--bg:#fff;--fg:#1a1a1a;--card:#f4f4f4;--line:#ddd;--me:#fff3a8}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#f0f0f0;--card:#232323;--line:#383838;--me:#5a5500}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;height:100dvh;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
input{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px;width:100%}
button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
#auth{margin:auto;width:min(380px,92%);display:flex;flex-direction:column;gap:10px;padding-top:env(safe-area-inset-top)}
#auth h1{text-align:center;color:var(--red);margin:0 0 6px}
#er{color:#c0392b;font-size:14px;min-height:18px}
#pv{width:84px;height:84px;border-radius:50%;object-fit:cover;align-self:center}
.hd{display:flex;align-items:center;gap:10px;background:var(--red);color:var(--yel);padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.hd b{flex:1}.hd button{background:rgba(0,0,0,.2);border-color:transparent;color:var(--yel)}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--yel);color:var(--red);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:12px}
.tabs .on{border-bottom:3px solid var(--red);font-weight:700}
.lst{flex:1;overflow:auto}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row small{display:block;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.pad{padding:12px;display:flex;flex-direction:column;gap:10px}
#chat{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:10}
#msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:8px 10px;border-radius:12px;background:var(--card);align-self:flex-start;word-break:break-word}
.m.me{background:var(--me);align-self:flex-end}
.m i{display:block;font-size:12px;opacity:.65;font-style:normal}
.m s{display:block;font-size:10px;opacity:.5;text-decoration:none;text-align:end}
#f{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end}
#ov>div{background:var(--bg);width:100%;max-height:70%;overflow:auto;border-radius:16px 16px 0 0}
.chk{display:flex;align-items:center;gap:10px;padding:8px 12px}.chk input{width:auto}
[hidden]{display:none!important}
#su:not([hidden]){display:flex}
#home:not([hidden]){display:flex;flex-direction:column;height:100%}
.hm{flex:1;display:flex;flex-direction:column;gap:14px;padding:20px;justify-content:center}
.hm h2{text-align:center;margin:0 0 6px}
.card2{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 16px;border-radius:18px;border:0;background:var(--red);color:#fff;font-size:20px}
#goLearn{background:var(--yel);color:#8a1a14}
.card2 span{font-size:44px}.card2 small{font-size:13px;opacity:.85}
#learn{position:fixed;inset:0;z-index:30;background:#fff}
#learn iframe{width:100%;height:100%;border:0}

.hd{background:linear-gradient(135deg,#e8120c,#b50d08);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hd b{font-size:17px}
.idchip{background:rgba(255,255,255,.2)!important;color:var(--yel)!important;border:0;border-radius:20px;padding:4px 10px!important;font-size:13px;direction:ltr}
.tabs{order:3;border-top:1px solid var(--line);border-bottom:0;background:var(--bg)}
.tabs button{padding:9px 4px;font-size:13px;display:flex;flex-direction:column;gap:2px;align-items:center}
.tabs .on{border-bottom:0;border-top:3px solid var(--red);color:var(--red)}
.lst{order:2}
.row{border-radius:14px;margin:6px 10px;border:1px solid var(--line);background:var(--card)}
.tag{font-size:12px;opacity:.6;direction:ltr;display:block;text-align:right}
.srch{padding:12px 10px 4px}
.m{border-radius:16px 16px 16px 4px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.m.me{border-radius:16px 16px 4px 16px}
#f input,#f button{border-radius:22px}
#auth{background:var(--card);padding:22px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.card2{box-shadow:0 8px 20px rgba(0,0,0,.18)}

#chat .hd{gap:8px}
.ttl{flex:1;display:flex;flex-direction:column;line-height:1.25;min-width:0}
.ttl small{font-size:12px;opacity:.85;font-weight:400}
#chat .av{width:38px;height:38px}
#msgs{padding:12px 10px;gap:3px;background:linear-gradient(180deg,var(--bg),var(--card))}
.mr{display:flex;align-items:flex-end;gap:6px;align-self:stretch}
.mr.me{justify-content:flex-end}
.mr .m{align-self:auto;max-width:78%}
.mr .av{width:30px;height:30px;font-size:14px}
.av.sp{background:transparent;height:0}
.m i{color:var(--red);font-weight:700;opacity:1;font-size:12px;margin-bottom:2px}
.m.me{background:var(--me);color:inherit}
.day{align-self:center;margin:10px 0}
.day span{background:var(--card);border:1px solid var(--line);padding:3px 12px;border-radius:12px;font-size:12px;opacity:.85}
.empty{text-align:center;opacity:.6;margin:auto;padding:20px}
.empty.err{color:#c0392b;opacity:1}
#f{background:var(--bg);align-items:center}
#f input{flex:1}
.send{width:46px;height:46px;border-radius:50%!important;background:var(--red);color:#fff;border:0;padding:0;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}

#prof:not([hidden]){position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column}
#pbody{flex:1;overflow:auto;padding:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.pc img.pi{width:100%;border-radius:12px;margin-top:8px;display:block}
.ph{display:flex;align-items:center;gap:10px}
.big-av{display:flex;justify-content:center}
.big-av .av{width:76px;height:76px;font-size:32px}
#pbody textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:70px;font:inherit;color:inherit;resize:vertical}
.card2{padding:16px}.card2 span{font-size:32px}
.pbtn{margin-inline-start:auto;padding:6px 12px!important;font-size:13px}
</style>
</head>
<body>
<div id="auth">
 <h1>إيزيدي دردشة</h1>
 <img id="pv" hidden alt="">
 <div id="su" hidden style="flex-direction:column;gap:10px">
  <input id="nm" placeholder="اسمك">
  <label>صورة الحساب: <input id="pf" type="file" accept="image/*"></label>
 </div>
 <input id="em" type="email" placeholder="البريد الإلكتروني" dir="ltr">
 <input id="pw" type="password" placeholder="كلمة السر (6 أحرف على الأقل)" dir="ltr">
 <div id="er"></div>
 <button class="pri" id="go">دخول</button>
 <button id="sw">ليس لدي حساب</button>
</div>

<div id="home" hidden>
 <div class="hd"><span id="hav"></span><b id="hn"></b><button class="idchip" id="hid"></button><button id="hout">خروج</button></div>
 <div class="hm"><h2 id="hh">اختر ما تريد</h2>
  <button class="card2" id="goChat"><span>💬</span><b>الدردشة الإيزيدية</b><small>الدردشة العالمية والخاصة والمجموعات</small></button>
  <button class="card2" id="goLearn"><span>📚</span><b>تعليم اللغة الإيزيدية</b><small>الكيبورد والدروس والاختبار والنطق</small></button>
  <button class="card2" id="goProf" style="background:#2b2b2b"><span>👤</span><b>صفحتي ومنشوراتي</b><small>انشر أحداثًا وصورًا وعرّف الناس بنفسك</small></button>
  <button class="card2" id="goFeed" style="background:#fff;color:#b50d08;border:2px solid #e8120c"><span>📰</span><b>المنشورات</b><small>شاهد ما ينشره الجميع</small></button>
 </div>
</div>
<div id="prof" hidden>
 <div class="hd"><button id="pb">→</button><b id="pt" style="flex:1"></b></div>
 <div id="pbody"></div>
</div>
<div id="learn" hidden><iframe id="lf" allow="clipboard-write"></iframe></div>
<div id="app" style="display:none;flex-direction:column;height:100%">
 <div class="hd"><span id="me"></span><b id="myn"></b><button class="idchip" id="myid"></button><button id="gh">الرئيسية</button><button id="out">خروج</button></div>
 <div class="tabs"><button data-t="chats" class="on"><span>💬</span>المحادثات</button><button data-t="people"><span>🔎</span>الأشخاص</button><button data-t="new"><span>➕</span>مجموعة جديدة</button></div>
 <div class="lst" id="v-chats"></div>
 <div class="lst" id="v-people" hidden></div>
 <div class="lst" id="v-new" hidden></div>
</div>

<div id="chat" hidden>
 <div class="hd"><button id="bk">→</button><span id="cav"></span><div class="ttl"><b id="ct"></b><small id="cs"></small></div><button id="ad" hidden>＋ إضافة</button></div>
 <div id="msgs"></div>
 <form id="f"><input id="tx" placeholder="اكتب رسالة" autocomplete="off"><button class="send" aria-label="إرسال">➤</button></form>
</div>
<div id="ov" hidden><div id="ovl"></div></div>

const shrinkW=(f,w=720)=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,w/i.width),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.65))};i.src=URL.createObjectURL(f)});
const ago=d=>d.toLocaleString("ar",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
function postCard(p){const u=users[p.uid]||{};return `<div class="pc"><div class="ph" data-u="${p.uid}" style="cursor:pointer">${av(u)}<div><b>${esc(u.name||"")}</b><span class="tag">${p.t?ago(p.t.toDate()):""}</span></div>${p.uid===me.id?`<button data-del="${p.id}" style="margin-inline-start:auto">🗑</button>`:""}</div>${p.text?`<p style="white-space:pre-wrap;margin:8px 0 0">${esc(p.text)}</p>`:""}${p.image?`<img class="pi" src="${p.image}" alt="">`:""}</div>`}
function watchPosts(q,box){if(unP)unP();unP=onSnapshot(q,s=>{const L=[];s.forEach(d=>L.push({id:d.id,...d.data()}));L.sort((a,b)=>(b.t?b.t.seconds:9e12)-(a.t?a.t.seconds:9e12));box.innerHTML=L.length?L.map(postCard).join(""):'<p class="empty">لا توجد منشورات بعد.</p>'},err=>{box.innerHTML='<p class="empty err">تعذّر تحميل المنشورات: '+esc(err.code||err.message)+'</p>'})}
async function openDM(oid){const id=dmId(me.id,oid),ref=doc(db,"rooms",id);try{const d=await getDoc(ref);if(!d.exists())await setDoc(ref,{type:"dm",members:[me.id,oid],updatedAt:serverTimestamp()})}catch(err){alert("تعذّر فتح المحادثة: "+(err.code||err.message));return}openRoom(id)}
function openProf(uid){
 const feed=uid==="feed",u=users[uid]||{},mineP=uid===me.id;
 $("prof").hidden=false;$("pt").textContent=feed?"المنشورات":(u.name||"");pimg="";let h="";
 if(!feed)h+=`<div class="pc" style="text-align:center"><div class="big-av">${av(u)}</div><h3 style="margin:8px 0 2px">${esc(u.name)}</h3><span class="tag" style="text-align:center">ID ${esc(u.pid||"-")}</span><p style="opacity:.8">${esc(u.bio||"")}</p>${mineP?'<button id="eb">تعديل النبذة</button>':'<button class="pri" id="dmb">💬 مراسلة</button>'}</div>`;
 if(feed||mineP)h+=`<div class="pc"><textarea id="pt2" placeholder="ماذا تريد أن تنشر؟ حدث، خبر، صورة…"></textarea><img id="ppv" class="pi" hidden alt=""><div class="ph" style="margin-top:8px"><label class="pri" style="padding:10px 14px;border-radius:10px;cursor:pointer">📷 صورة<input id="pfile" type="file" accept="image/*" hidden></label><button class="pri" id="pp" style="margin-inline-start:auto">نشر</button></div></div>`;
 h+='<div id="plist"></div>';$("pbody").innerHTML=h;
 if($("pfile"))$("pfile").onchange=async e=>{const f=e.target.files[0];if(!f)return;pimg=await shrinkW(f);$("ppv").src=pimg;$("ppv").hidden=false};
 if($("pp"))$("pp").onclick=async()=>{const t=$("pt2").value.trim();if(!t&&!pimg)return;try{await addDoc(collection(db,"posts"),{uid:me.id,text:t,image:pimg,t:serverTimestamp()});$("pt2").value="";pimg="";$("ppv").hidden=true}catch(err){alert("تعذّر النشر: "+(err.code||err.message))}};
 if($("eb"))$("eb").onclick=async()=>{const b=prompt("اكتب نبذة قصيرة عنك",u.bio||"");if(b===null)return;try{await updateDoc(doc(db,"users",me.id),{bio:b.slice(0,140)});openProf(uid)}catch(err){alert("تعذّر الحفظ: "+(err.code||err.message))}};
 if($("dmb"))$("dmb").onclick=()=>{$("pb").click();openDM(uid)};
 watchPosts(feed?query(collection(db,"posts"),orderBy("t","desc"),limit(50)):query(collection(db,"posts"),where("uid","==",uid),limit(100)),$("plist"));
}
$("pb").onclick=()=>{$("prof").hidden=true;if(unP){unP();unP=null}};
$("pbody").onclick=async e=>{const d=e.target.closest("[data-del]");if(d){if(confirm("حذف هذا المنشور؟"))try{await deleteDoc(doc(db,"posts",d.dataset.del))}catch(err){alert("تعذّر الحذف: "+(err.code||err.message))}return}const h=e.target.closest("[data-u]");if(h&&h.dataset.u!==me.id)openProf(h.dataset.u)};
$("goProf").onclick=()=>openProf(me.id);
$("goFeed").onclick=()=>openProf("feed");
async function newPid(){for(let i=0;i<8;i++){const p=String(Math.floor(1e7+Math.random()*9e7));const r=await getDocs(query(collection(db,"users"),where("pid","==",p),limit(1)));if(r.empty)return p}return String(Date.now()).slice(-8)}
const WORLD={id:"world",type:"public",name:"🌍 الدردشة العالمية",members:[]};
window.__fb=true;
let me=null,users={},rooms=[],cur=null,unM=null,photo="",started=false;

/* ---- الحساب ---- */
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=c.height=96;const x=c.getContext("2d"),s=Math.min(i.width,i.height);x.drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,96,96);r(c.toDataURL("image/jpeg",.7))};i.src=URL.createObjectURL(f)});
$("pf").onchange=async e=>{const f=e.target.files[0];if(!f)return;photo=await shrink(f);$("pv").src=photo;$("pv").hidden=false};
$("go").onclick=async()=>{$("er").textContent="";try{const em=$("em").value.trim(),pw=$("pw").value;
 if(!$("su").hidden){const nm=$("nm").value.trim();if(!nm)throw new Error("اكتب اسمك");const c=await createUserWithEmailAndPassword(auth,em,pw);await setDoc(doc(db,"users",c.user.uid),{name:nm,photo,pid:await newPid(),created:serverTimestamp()})}
 else await signInWithEmailAndPassword(auth,em,pw)}catch(e){$("er").textContent=e.message}};
$("out").onclick=async()=>{await signOut(auth);location.reload()};

onAuthStateChanged(auth,u=>{
 if(!u){$("auth").hidden=false;$("app").style.display="none";return}
 onSnapshot(collection(db,"users"),s=>{users={};s.forEach(d=>users[d.id]={id:d.id,...d.data()});
  if(users[u.uid]&&!started){started=true;start(u.uid)}else if(started)drawAll()});
});

async function start(uid){
 me=users[uid];if(!me.pid){me.pid=await newPid();try{await updateDoc(doc(db,"users",uid),{pid:me.pid})}catch(e){}}
 $("auth").hidden=true;
 $("v-people").innerHTML='<div class="srch"><input id="ps" placeholder="ابحث بالاسم أو برقم الـ ID" inputmode="search"></div><div id="pl"></div>';
 $("ps").oninput=drawPeople;
 ["myid","hid"].forEach(i=>{$(i).textContent="ID "+me.pid;$(i).onclick=()=>{try{navigator.clipboard.writeText(me.pid)}catch(e){}alert("رقم الـ ID الخاص بك: "+me.pid+"\nشاركه مع أصدقائك ليجدوك.")}});
 showHome();
 $("me").innerHTML=av(me);$("myn").textContent=me.name;
 try{const d=await getDoc(doc(db,"rooms","world"));if(!d.exists())await setDoc(doc(db,"rooms","world"),{type:"public",public:true,name:"الدردشة العالمية",members:[]})}catch(e){}
 onSnapshot(query(collection(db,"rooms"),where("members","array-contains",uid)),s=>{rooms=[];s.forEach(d=>rooms.push({id:d.id,...d.data()}));drawAll()});
 drawAll();
}

/* ---- الواجهة ---- */
const av=u=>u&&u.photo?`<img class="av" src="${u.photo}" alt="">`:`<span class="av">${esc((u&&u.name||"؟")[0])}</span>`;
const other=r=>users[(r.members||[]).find(m=>m!==me.id)];
const title=r=>r.id==="world"?WORLD.name:r.type==="dm"?(other(r)||{}).name||"…":r.name;
const ravatar=r=>r.type==="dm"?av(other(r)):`<span class="av">${r.id==="world"?"🌍":esc((r.name||"؟")[0])}</span>`;
const dmId=(a,b)=>[a,b].sort().join("_");

document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;
 document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
 ["chats","people","new"].forEach(t=>$("v-"+t).hidden=t!==b.dataset.t)};

function drawAll(){if(!me)return;drawChats();drawPeople();drawNew()}
function drawChats(){
 const L=[WORLD,...rooms.slice().sort((a,b)=>(b.updatedAt?.seconds||0)-(a.updatedAt?.seconds||0))];
 $("v-chats").innerHTML=L.map(r=>`<div class="row" data-id="${r.id}">${ravatar(r)}<div><b>${esc(title(r))}</b><small>${esc(r.last||"")}</small></div></div>`).join("");
}
$("v-chats").onclick=e=>{const r=e.target.closest(".row");if(r)openRoom(r.dataset.id)};
function drawPeople(){
 const q=(($("ps")||{}).value||"").trim().toLowerCase();
 let list=Object.values(users).filter(u=>u.id!==me.id);
 if(q)list=list.filter(u=>(u.name||"").toLowerCase().includes(q)||String(u.pid||"").includes(q));
 $("pl").innerHTML=list.length?list.map(u=>`<div class="row" data-id="${u.id}">${av(u)}<div><b>${esc(u.name)}</b><span class="tag">ID ${esc(u.pid||"-")}</span></div><button class="pbtn" data-pf="${u.id}">الملف</button></div>`).join(""):'<p class="pad">'+(q?"لا توجد نتيجة لهذا البحث.":"لا يوجد أشخاص آخرون بعد. شارك رقم الـ ID الخاص بك مع أصدقائك.")+'</p>';
}
$("v-people").onclick=async e=>{const pf=e.target.closest("[data-pf]");if(pf){openProf(pf.dataset.pf);return}const r=e.target.closest(".row");if(!r)return;
 const id=dmId(me.id,r.dataset.id),ref=doc(db,"rooms",id);
 try{const d=await getDoc(ref);if(!d.exists())await setDoc(ref,{type:"dm",members:[me.id,r.dataset.id],updatedAt:serverTimestamp()})}
 catch(err){alert("تعذّر فتح المحادثة: "+(err.code||err.message));return}
 openRoom(id)};
function drawNew(){
 const keep=$("gn")?$("gn").value:"";
 const sel=[...document.querySelectorAll("#v-new .chk input:checked")].map(x=>x.value);
 $("v-new").innerHTML=`<div class="pad"><input id="gn" placeholder="اسم المجموعة" value="${esc(keep)}"><b>اختر الأعضاء:</b></div>`+
 Object.values(users).filter(u=>u.id!==me.id).map(u=>`<label class="chk"><input type="checkbox" value="${u.id}" ${sel.includes(u.id)?"checked":""}>${av(u)}<span>${esc(u.name)}</span></label>`).join("")+
 `<div class="pad"><button class="pri" id="mk">إنشاء المجموعة</button></div>`;
 $("mk").onclick=async()=>{const n=$("gn").value.trim(),ms=[...document.querySelectorAll("#v-new .chk input:checked")].map(x=>x.value);
  if(!n)return alert("اكتب اسم المجموعة");
  const r=await addDoc(collection(db,"rooms"),{type:"group",name:n,owner:me.id,members:[me.id,...ms],updatedAt:serverTimestamp()});
  $("gn").value="";document.querySelectorAll("#v-new .chk input").forEach(x=>x.checked=false);
  document.querySelector('.tabs [data-t="chats"]').click();openRoom(r.id)};
}

/* ---- المحادثة ---- */
function roomOf(id){return id==="world"?WORLD:rooms.find(r=>r.id===id)}
function openRoom(id){
 cur=id;const r=roomOf(id)||{id,type:"dm",members:id.split("_")};
 $("chat").hidden=false;$("ct").textContent=title(r);$("cav").innerHTML=ravatar(r);
 $("cs").textContent=r.id==="world"?"كل المستخدمين":r.type==="dm"?"ID "+((other(r)||{}).pid||""):(r.members||[]).length+" أعضاء";
 $("ad").hidden=r.type!=="group";$("msgs").innerHTML='<p class="empty">جارٍ التحميل…</p>';
 if(unM)unM();
 unM=onSnapshot(query(collection(db,"rooms",id,"messages"),orderBy("t"),limit(200)),s=>{
  const dm=r.type==="dm";let day0="",lastU="",h="";
  s.docs.forEach(d=>{const m=d.data(),mine=m.uid===me.id,u=users[m.uid]||{};
   const dt=m.t?m.t.toDate():new Date();
   const day=dt.toLocaleDateString("ar",{day:"numeric",month:"long"});
   if(day!==day0){h+=`<div class="day"><span>${day}</span></div>`;day0=day;lastU=""}
   const t=dt.toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"});
   const first=lastU!==m.uid;lastU=m.uid;
   h+=`<div class="mr ${mine?"me":""}">${!mine&&!dm?(first?av(u):'<span class="av sp"></span>'):""}<div class="m ${mine?"me":""}">${!mine&&!dm&&first?`<i>${esc(u.name||"")}</i>`:""}${esc(m.text)}<s>${t}</s></div></div>`});
  $("msgs").innerHTML=h||'<p class="empty">لا توجد رسائل بعد. ابدأ المحادثة 👋</p>';
  $("msgs").scrollTop=1e9},
  err=>{$("msgs").innerHTML='<p class="empty err">تعذّر تحميل الرسائل: '+esc(err.code||err.message)+'</p>'});
}
$("bk").onclick=()=>{$("chat").hidden=true;if(unM){unM();unM=null}cur=null};
$("f").onsubmit=async e=>{e.preventDefault();const t=$("tx").value.trim();if(!t||!cur)return;$("tx").value="";
 try{await addDoc(collection(db,"rooms",cur,"messages"),{uid:me.id,text:t,t:serverTimestamp()})}
 catch(err){alert("تعذّر إرسال الرسالة: "+(err.code||err.message));$("tx").value=t;return}
 if(cur!=="world")try{await updateDoc(doc(db,"rooms",cur),{last:t.slice(0,60),updatedAt:serverTimestamp()})}catch(err){}};

/* ---- إضافة أعضاء إلى مجموعة ---- */
$("ad").onclick=()=>{const r=roomOf(cur);if(!r)return;
 const l=Object.values(users).filter(u=>!r.members.includes(u.id));
 $("ovl").innerHTML='<div class="pad"><b>إضافة إلى المجموعة</b></div>'+(l.length?l.map(u=>`<div class="row" data-id="${u.id}">${av(u)}<b>${esc(u.name)}</b></div>`).join(""):'<p class="pad">الجميع في المجموعة.</p>')+'<div class="pad"><button id="cx">إغلاق</button></div>';
 $("ov").hidden=false;$("cx").onclick=()=>$("ov").hidden=true};
$("ovl").onclick=async e=>{const r=e.target.closest(".row");if(!r)return;
 await updateDoc(doc(db,"rooms",cur),{members:arrayUnion(r.dataset.id)});r.remove()};
</script>
</body>
</html>
